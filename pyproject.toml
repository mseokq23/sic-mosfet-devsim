[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicsim"
version = "0.2.0"
description = "DEVSIM-based multi-temperature inverse estimation of process-outcome parameters in 4H-SiC planar MOSFETs and evaluation of LLM-assisted TCAD sample selection"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
