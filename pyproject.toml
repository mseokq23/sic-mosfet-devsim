[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicsim"
version = "0.2.0"
description = "DEVSIM simulation of 4H-SiC planar MOSFET I-V characteristics at 300 K and 423 K, feature extraction, inverse models and sample-selection policies"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
