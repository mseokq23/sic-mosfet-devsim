# Baseline configuration (protocol is FROZEN after DOE freeze day; change -> new version tag)
version: variant-gamma_m1 (v1.1-frozen + mu_surf_gamma=-1; robustness study v1.3, 423 K only)

numerics:
  extended_precision: false     # Gate 3: double == 128-bit features (dVth ~1e-11 V), 3x faster; gates 1-2 force 128-bit
  incomplete_ionization: true
  holes: false                  # false = unipolar n-channel DD (holes in equilibrium with source/body)
  interface_mode: static        # static | trap | none
  tol: {absolute_error: 1.0e10, relative_error: 1.0e-6, maximum_iterations: 40}   # DEVSIM rel err = |dx|/(|x|+1e-10); 1e-9 is below the double-precision floor for SiC

material:                        # overrides of src/sicsim/params.py defaults (SiC4H)
  surf_lambda_um: 0.003
  mu_surf300: 20.0
  mu_surf_gamma: -1.0               # ROBUSTNESS VARIANT (was 1.0 in v1.1-frozen)

gate: {phi_m: 4.1}               # n+ poly-Si

interface:
  qf_cm2: 1.0e12                 # fixed positive oxide charge (calibration constant, not a DOE variable)
  qit_eff_cm2: -1.0e12           # DOE variable: effective trapped interface charge (signed, static)
  nit_trap_cm2: 0.0              # only used with interface_mode: trap
  trap_Ec_minus_Et: 0.2

pn_diode: {length_um: 10.0, xj_um: 2.0, NA: 1.0e18, ND: 1.0e16, straggle_um: 0.01}

moscap: {tox_um: 0.05, length_um: 3.0, NA: 1.0e17}

mosfet:
  geometry:
    tox_um: 0.05
    x_pp_um: 0.5           # p+ body contact region width (from symmetry line)
    d_pp_um: 0.3
    x_ns0_um: 0.5          # n+ source start
    x_ns1_um: 1.8          # n+ source end = channel start
    d_ns_um: 0.25
    x_pw_um: 2.3           # P-well edge = channel end  (L_ch = 0.5 um)
    d_pw_um: 0.7
    wjfet_um: 2.4          # FULL JFET width (half-cell uses wjfet/2); DOE variable via wjfet_scale
    wjfet_mode: fixed_pitch  # v1.1: pitch fixed, self-aligned P-well/n+ edge moves (channel length kept)
    d_jfet_um: 1.0
    t_drift_um: 10.0
    t_sub_um: 1.0
    x_src_contact_um: 1.4
    x_ox_start_um: 1.5
  mesh_scale: 1.5          # production mesh (set from Gate-3 mesh study; 1.0 = fine)
  doping:                  # cm^-3
    N_pp: 1.0e19
    N_ns: 2.0e19
    N_pw: 1.0e17           # DOE variable via npwell_scale
    N_jfet: 2.0e16
    N_drift: 1.0e16
    N_sub: 1.0e19
    straggle_um: 0.03

bias:
  vds_lin: 0.1
  vgs_segments: [[10.0, 0.25], [20.0, 0.5]]   # transfer at vds_lin: 0->10 V step 0.25, 10->20 V step 0.5
  vgs_on: 18.0                               # output curve gate bias
  vds_segments: [[0.5, 0.1], [5.0, 0.5]]     # output: 0.1->0.5 V step 0.1, ->5 V step 0.5
  vds_required: 2.0                          # output may stop early only beyond this VDS (feature id@2V)

extract:                    # FIXED extraction protocol (do not tune after seeing results)
  vth_method: constant_current
  icc_A_per_cm: 1.0e-4      # constant-current criterion at VDS=vds_lin (per cm gate width)
  ss_window_A_per_cm: [1.0e-10, 1.0e-6]   # must stay >10x above the numerical (KCL) floor
  vgs_on: 18.0              # Ion / Ron reference gate bias
  ron_vds_max: 0.5          # Ron from output-curve slope for VDS <= this value
  feature_vgs: [4, 5, 6, 7, 8, 10, 12, 14, 16, 18, 20]

temperatures_K: [300, 423]
